.wrap{padding-block:22px 28px;display:flex;flex-direction:column;gap:16px}
.label{font:600 14px var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:0}

.lead{font-size:19px;margin:0}
.place{font:600 18px var(--font);margin:0}
.muted{color:var(--muted);margin:0}
p{margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap}

.bigpts{font:700 76px/1 var(--font);margin:0;letter-spacing:-.03em}

.tbl{width:100%;border-collapse:collapse;font-size:17px}

.tbl td:last-child,.tbl th:last-child{text-align:right;font-variant-numeric:tabular-nums}
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.board li{display:grid;grid-template-columns:2em 1fr auto auto;gap:10px;align-items:center;background:var(--panel);padding:8px 12px;border-left:6px solid var(--line)}
.board li.me{border-left-color:var(--accent);font-weight:700}
.board li.first{background:var(--ink);color:var(--bg);border-left-color:var(--accent)}
.board li.off{opacity:.5}
.board .pos{font:700 20px var(--font)}
.board .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .st{font:600 12px var(--font);letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.board .pts{font-weight:700;font-variant-numeric:tabular-nums}
.board .pts small{font-weight:500;opacity:.7;margin-left:4px}
.board li.gap{background:none;border:0;padding:0;display:block;text-align:center;color:var(--muted);line-height:1}
.winner{background:var(--ink);color:var(--bg);padding:18px 16px;border-left:6px solid var(--accent)}
.winner small{display:block;font:600 14px var(--font);letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.winner b{display:block;font:700 40px/1.05 var(--font);letter-spacing:-.02em;overflow-wrap:anywhere}
#live,#host{max-width:520px;margin-inline:auto;width:100%;padding:0 max(16px,env(safe-area-inset-left,0px)) 22px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px}
#host{padding-bottom:36px}
.hostbox{border:2px dashed var(--muted);padding:12px;display:flex;flex-direction:column;gap:10px}
.hostbox .btn{font-size:16px;padding:9px 16px}
.foot{font-size:14px;color:var(--muted)}
.demo{background:var(--mustard);color:var(--on-mustard);font:600 14px var(--font);padding:7px 12px;text-align:center}
@media (prefers-reduced-motion: reduce){.btn{transition:none}}
</style>

/* Live: Firebase Realtime Database over REST + EventSource (ingen SDK, intet login).
   Demo: samme grænseflade i hukommelsen med computerspillere, så siden kan prøves uden database. */
const DB_URL=String(window.HAANING_DB_URL||'').trim().replace(/\/+$/,'');
const ROOM=String(window.HAANING_ROOM||'bus').replace(/[^a-z0-9_-]/gi,'')||'bus';
const LIVE=!!DB_URL;

const STATE0={phase:'lobby',round:-1};
function setPath(root,path,val){
  const ks=String(path).split('/').filter(Boolean); let o=root;
  for(let i=0;i<ks.length-1;i++){ if(o[ks[i]]==null||typeof o[ks[i]]!=='object') o[ks[i]]={}; o=o[ks[i]]; }
  const k=ks[ks.length-1]; if(val===null||val===undefined) delete o[k]; else o[k]=val;
}
const clone=v=>v&&typeof v==='object'?JSON.parse(JSON.stringify(v)):v;
let ME=load('hb-me',null);
if(!ME||!ME.pid){ ME={pid:'p'+Math.random().toString(36).slice(2,10),name:''}; save('hb-me',ME); }

const Net=(function(){
  let tree={},subs=[],conn=!LIVE,loaded=!LIVE,offset=0,es=null,pend=null,bestRtt=1e9,queued=false;
  const url=()=>DB_URL+'/rooms/'+ROOM+'.json';
  function notify(){ if(queued) return; queued=true; setTimeout(()=>{ queued=false; subs.forEach(f=>{ try{f();}catch(e){ if(window.console) console.error(e); } }); },0); }
  function localApply(obj){ for(const k in obj){ const v=obj[k]; if(v&&typeof v==='object'&&'.sv' in v) continue; setPath(tree,k,clone(v)); } }
  function send(obj){ try{ fetch(url(),{method:'PATCH',body:JSON.stringify(obj),keepalive:true}).catch(()=>{}); }catch(e){} }
  function afterRemote(){
    if(pend){ const v=(tree.clock||{})[ME.pid]; if(v&&v!==pend.prev){ const t1=Date.now(),rtt=t1-pend.t0; if(rtt<bestRtt&&typeof v==='number'){ bestRtt=rtt; offset=v-(pend.t0+t1)/2; } pend=null; } }
    notify();
  }
  function sync(){ pend={t0:Date.now(),prev:(tree.clock||{})[ME.pid]}; send({['clock/'+ME.pid]:{'.sv':'timestamp'}}); }
  function open(){
    es=new EventSource(url());
    es.onopen=()=>{ conn=true; notify(); };
    es.onerror=()=>{ conn=false; notify(); };
    es.addEventListener('put',ev=>{ let d; try{ d=JSON.parse(ev.data); }catch(e){ return; }
      if(d.path==='/'){ tree=d.data&&typeof d.data==='object'?d.data:{}; loaded=true; } else setPath(tree,d.path,d.data); afterRemote(); });
    es.addEventListener('patch',ev=>{ let d; try{ d=JSON.parse(ev.data); }catch(e){ return; }
      const base=d.path==='/'?'':d.path; for(const k in d.data) setPath(tree,base+'/'+k,d.data[k]); afterRemote(); });
    sync(); setTimeout(sync,1200); setTimeout(sync,2600); setInterval(sync,60000);
  }
  return {
    live:LIVE,
    T(){ return {state:Object.assign({},STATE0,tree.state||{}),players:tree.players||{}}; },
    now(){ return Date.now()+offset; },
    connected(){ return conn; },
    loaded(){ return loaded; },
    on(fn){ subs.push(fn); },
    patch(obj){ localApply(obj); if(LIVE) send(obj); notify(); },
    start(){ if(LIVE) open(); else notify(); }
  };
})();

function startBots(){
  const names=['Ole','Henrik','Lise','Mette','Jens','Camilla','Søren'];
  const bots=names.map((n,i)=>({id:'bot'+i,name:n,skill:0.45+Math.random()*0.5,plan:null}));
  const rec=b=>({name:b.name,seen:Net.now(),done:-1,ready:-1});
  bots.forEach(b=>Net.patch({['players/'+b.id]:rec(b)}));
  let tick=0;
  setInterval(()=>{
    tick++; const T=Net.T(),st=T.state,now=Net.now(),upd={};
    bots.forEach(b=>{
      const me=T.players[b.id];
      if(!me){ upd['players/'+b.id]=rec(b); b.plan=null; return; }
      if(tick%5===0) upd['players/'+b.id+'/seen']=now;
      if(st.phase!=='round') return;
      const r=st.round;
      if(!b.plan||b.plan.r!==r) b.plan={r:r,finish:st.startAt+(18+Math.random()*30)*1000,ready:null,half:false,done:me.done>=r};
      const p=b.plan;
      if(!p.done&&now>=p.finish){
        const pts=Math.round(100*clamp(b.skill*(0.55+Math.random()*0.5),0.15,0.97)),g=Math.round(pts*0.55);
        upd['players/'+b.id+'/rounds/s'+r]={p:pts,g:g,q:pts-g};
        upd['players/'+b.id+'/done']=r; upd['players/'+b.id+'/live']=null;
        p.done=true; p.ready=now+(2+Math.random()*6)*1000;
      } else if(!p.done&&!p.half&&now>=(p.finish+st.startAt)/2){
        p.half=true; upd['players/'+b.id+'/live']={r:r,p:Math.round(40*b.skill)};
      }
      if(p.done&&p.ready&&now>=p.ready&&(me.ready==null||me.ready<r)) upd['players/'+b.id+'/ready']=r;
    });
    if(Object.keys(upd).length) Net.patch(upd);
  },1000);
}

function questionCard(q,limit,cb){
  const order=shuffle(q.o.map((t,i)=>({t:t,i:i})));
  let done=false; const t0=performance.now();
  const timer=h('div',{class:'timer'},h('i'));
  const list=h('div',{class:'opts'});
  const note=h('p',{class:'qnote',hidden:true});
  const btns=order.map(o=>{ const b=h('button',{class:'opt',type:'button'},o.t); b.addEventListener('click',()=>pick(o.i,b)); return b; });
  list.append.apply(list,btns);
  const el=h('div',{class:'qcard'},h('p',{class:'qtext',text:q.q}),timer,list,note);
  const rightBtn=()=>btns[order.findIndex(o=>o.i===q.a)];
  function showNote(){ if(q.n){ note.textContent=q.n; note.hidden=false; } }
  function pick(i,b){
    if(done) return; done=true; clearInterval(iv);
    const secs=(performance.now()-t0)/1000, ok=i===q.a;
    b.classList.add(ok?'right':'wrong'); if(!ok) rightBtn().classList.add('right');
    btns.forEach(x=>{x.disabled=true;}); showNote(); cb(ok,secs,false);
  }
  const iv=setInterval(()=>{
    const f=Math.max(0,1-(performance.now()-t0)/1000/limit); timer.firstChild.style.width=(f*100)+'%';
    if(f<=0&&!done){ done=true; clearInterval(iv); btns.forEach(x=>{x.disabled=true;}); rightBtn().classList.add('right'); showNote(); cb(false,limit,true); }
  },100);
  return {el:el,destroy:function(){ done=true; clearInterval(iv); }};
}

async function trivia(R,r,base){
  const qs=R.questions,lim=R.limit||25,pb=R.pop?7:10,bb=R.pop?3:5; let points=0,correct=0,bonus=0;
  for(let i=0;i<qs.length;i++){
    await new Promise(resolve=>{
      const res=h('p',{class:'qres'});
      const next=h('button',{class:'btn',type:'button',hidden:true,text:i===qs.length-1?'Færdig':'Næste'}); next.addEventListener('click',resolve);
      const card=questionCard(qs[i],lim,(ok,secs,to)=>{
        let p=0; if(ok){ p=pb+Math.round(bb*clamp((lim*0.8-secs)/(lim*0.6),0,1)); correct++; bonus+=p-pb; }
        points+=p; sendLive(r,base+points);
        res.textContent=ok?'Rigtigt! +'+p+' point':(to?'Tiden løb ud. 0 point':'Forkert. 0 point'); res.className='qres '+(ok?'ok':'no'); next.hidden=false;
      });
      show('trivia',h('p',{class:'label',text:R.title+' · spørgsmål '+(i+1)+' af '+qs.length}),card.el,res,h('div',{class:'row'},next));
      cleanup=()=>card.destroy();
    });
  }
  return {points:points,correct:correct,total:qs.length,bonus:bonus};
}

    g.strokeStyle=col.ink; g.lineWidth=3; g.stroke();
    g.lineWidth=1.5; for(let i=-2;i<=2;i++){ g.beginPath(); g.moveTo(bk.x+i*13,bk.y-10); g.lineTo(bk.x+i*11,bk.y+14); g.stroke(); }
    x.L.textContent='Tid '+Math.max(0,Math.ceil(20-t))+' s';
    x.R.textContent='Rundstykker '+score;
    if(t>=20) x.finish(score/18,score+' rundstykker i kurven');
  });

};
GAMES.pour=function(x){
  const W=x.w,H=x.h,cv=mkCanvas(x.box,W,H),c=cv.c,g=cv.g,col=colors(),N=5;
  let attempt=0,u=0,dir=1,speed=0.85,center=0.5,hw=0.075,state='run',pause=0,msg='',scores=[],runT=0;
  function newRound(){ speed=0.65+attempt*0.2; center=0.25+Math.random()*0.5; hw=0.075-attempt*0.006; u=Math.random()<0.5?0:1; dir=u===0?1:-1; state='run'; msg=''; runT=0; }
  function tap(){
    if(state!=='run') return;
    const err=Math.abs(u-center), sc=err<=hw?1:Math.max(0,1-(err-hw)/0.3);
    scores.push(sc); msg=sc>=1?'Perfekt!':sc>0.6?'Tæt på':sc>0.25?'Lidt ved siden af':'Forbi'; state='pause'; pause=0.9; buzz(30);
  }
  c.addEventListener('pointerdown',e=>{ e.preventDefault(); tap(); });
  const onKey=e=>{ if(e.code==='Space'){ e.preventDefault(); tap(); } };
  window.addEventListener('keydown',onKey);
  newRound();
  const avg=()=>scores.length?scores.reduce((a,b)=>a+b,0)/scores.length:0;
  const stop=loop(dt=>{
    if(state==='run'){ u+=dir*speed*dt; if(u>=1){ u=1; dir=-1; } if(u<=0){ u=0; dir=1; } runT+=dt; if(runT>8){ scores.push(0); msg='For langsomt'; state='pause'; pause=0.9; } }
    else { pause-=dt; if(pause<=0){ attempt++; if(attempt>=N){ x.finish(avg(),'Gennemsnit '+Math.round(avg()*100)+' % af perfekt'); return; } newRound(); } }
    const cx=W/2,top=48,bot=168,cw=92,ch=bot-top;
    g.fillStyle=col.sky; g.fillRect(0,0,W,H);
    g.fillStyle=col.ground; g.fillRect(0,H-12,W,12);
    g.fillStyle=col.ink; g.fillRect(cx-6,8,12,30); g.fillRect(cx-18,8,36,8);
    g.fillStyle='#5A3A26'; g.fillRect(cx-cw/2+4,bot-u*(ch-8),cw-8,u*(ch-8));
    g.strokeStyle=col.ink; g.lineWidth=5; g.lineJoin='round'; g.beginPath(); g.moveTo(cx-cw/2,top); g.lineTo(cx-cw/2+8,bot); g.lineTo(cx+cw/2-8,bot); g.lineTo(cx+cw/2,top); g.stroke();
    g.beginPath(); g.arc(cx+cw/2+8,top+ch/2-4,16,-Math.PI/2,Math.PI/2); g.stroke();
    const ty0=bot-(center+hw)*(ch-8), ty1=bot-(center-hw)*(ch-8);
    g.fillStyle=col.green; g.globalAlpha=0.55; g.fillRect(cx-cw/2-22,ty0,cw+44,ty1-ty0); g.globalAlpha=1;
    g.fillStyle=col.green; g.fillRect(cx-cw/2-22,(ty0+ty1)/2-1.5,cw+44,3);
    g.fillStyle=col.ink; g.font='700 18px sans-serif'; g.textAlign='center'; g.fillText(msg,cx,H-22);
    x.L.textContent='Kop '+Math.min(attempt+1,N)+' af '+N;
    x.R.textContent='Snit '+Math.round(avg()*100)+' %';
  });
  x.setCleanup(()=>{ stop(); window.removeEventListener('keydown',onKey); });
};
GAMES.charge=function(x){
  const bat=h('div',{class:'bat'},h('i')), lab=h('div',{class:'kwh',text:'0,0 kWh'});
  const btn=h('button',{class:'btn big',type:'button',text:'TRYK!'});
  x.box.append(h('div',{class:'charge'},bat,lab,btn));
  const DUR=10,TARGET=65; let t=0,taps=0;
  function hit(){ taps++; bat.firstChild.style.width=Math.min(100,taps/TARGET*100)+'%'; lab.textContent=(taps*0.35).toFixed(1).replace('.',',')+' kWh'; }
  btn.addEventListener('pointerdown',e=>{ e.preventDefault(); hit(); });
  btn.addEventListener('click',e=>{ if(e.detail===0) hit(); });
  const stop=loop(dt=>{
    t+=dt; x.L.textContent='Tid '+Math.max(0,Math.ceil(DUR-t))+' s'; x.R.textContent='Tryk '+taps;
    if(t>=DUR) x.finish(taps/TARGET,taps+' tryk på 10 sekunder');
  });
  x.setCleanup(stop);
};

function runMinigame(R){
  const d=DIM[R.game],L=h('span'),Rr=h('span'),hud=h('div',{class:'hud'},L,Rr);
  const box=h('div',{class:'canvas-box'}); box.style.aspectRatio=d.w+' / '+d.h;
  show('game',h('p',{class:'label',text:R.title+' · '+R.gameName}),box,hud);
  return new Promise(resolve=>{
    let finished=false;
    GAMES[R.game]({box:box,L:L,R:Rr,w:d.w,h:d.h,setCleanup:fn=>{ cleanup=fn; },
      finish:(frac,text)=>{ if(finished) return; finished=true; if(cleanup){ try{cleanup();}catch(e){} cleanup=null; }
        endOverlay(box,text,()=>resolve({frac:clamp(frac,0,1),text:text})); }});
  });
}

/* ---------- rutsjebane-race ---------- */
function coasterRace(R,r){
  const W=360,H=240,QS=R.questions,GU=[0.14,0.31,0.48,0.64,0.8];
  const box=h('div',{class:'canvas-box'}); box.style.aspectRatio=W+' / '+H;
  const L=h('span'),Rr=h('span'),hud=h('div',{class:'hud'},L,Rr),panel=h('div',{class:'qslot'});
  show('game',h('p',{class:'label',text:R.title+' · '+R.gameName}),box,hud,panel);
  return new Promise(resolve=>{
    const cv=mkCanvas(box,W,H),g=cv.g,col=colors();
    let p=0,t=0,boost=0,brake=0,qi=0,active=false,activeCard=null,correct=0,results=[],hideTimer=0,finished=false;
    const ty=u=>148-50*Math.sin(u*Math.PI*2.6+0.4)+13*Math.sin(u*Math.PI*9);
    const tx=u=>18+u*(W-36);
    function open(i){
      active=true;
      activeCard=questionCard(QS[i],20,(ok)=>{
        results[i]=ok; if(ok){ correct++; boost=t+5; brake=0; } else { brake=t+3.5; boost=0; }
        sendLive(r,correct*8);
        active=false; clearTimeout(hideTimer); hideTimer=setTimeout(()=>{ if(!active) panel.replaceChildren(); },1800);
      });
      clearTimeout(hideTimer); panel.replaceChildren(activeCard.el);
    }
    function draw(){
      g.fillStyle=col.sky; g.fillRect(0,0,W,H);
      g.fillStyle=col.ground; g.fillRect(0,H-12,W,12);
      g.strokeStyle=col.line; g.lineWidth=2;
      for(let u=0.02;u<1;u+=0.04){ g.beginPath(); g.moveTo(tx(u),ty(u)); g.lineTo(tx(u),H-12); g.stroke(); }
      g.lineJoin='round'; g.lineCap='round'; g.beginPath();
      for(let i=0;i<=120;i++){ const u=i/120; if(i) g.lineTo(tx(u),ty(u)); else g.moveTo(tx(u),ty(u)); }
      g.strokeStyle=col.ink; g.lineWidth=7; g.stroke(); g.strokeStyle=col.mustard; g.lineWidth=3; g.stroke();
      GU.forEach((u,i)=>{
        const x0=tx(u),y0=ty(u),st=results[i];
        g.strokeStyle=col.ink; g.lineWidth=2; g.beginPath(); g.moveTo(x0,y0); g.lineTo(x0,y0-30); g.stroke();
        g.fillStyle=st===true?col.green:st===false?col.ketchup:col.panel; rr(g,x0-9,y0-42,18,14,3); g.fill(); g.strokeStyle=col.ink; g.lineWidth=2; g.stroke();
        g.fillStyle=st===undefined?col.ink:'#FFFFFF'; g.font='700 11px sans-serif'; g.textAlign='center'; g.fillText(String(i+1),x0,y0-31);
      });
      const u=clamp(p/1000,0,1),x1=tx(u),y1=ty(u),ang=Math.atan2(ty(Math.min(1,u+0.004))-ty(Math.max(0,u-0.004)),tx(Math.min(1,u+0.004))-tx(Math.max(0,u-0.004)));
      g.save(); g.translate(x1,y1-8); g.rotate(ang);
      if(t<boost){ g.fillStyle=col.mustard; for(let k=0;k<3;k++){ g.beginPath(); g.moveTo(-15,-6+k*5); g.lineTo(-30-Math.random()*8,-3+k*5); g.lineTo(-15,-1+k*5); g.closePath(); g.fill(); } }
      g.fillStyle=col.ketchup; rr(g,-15,-10,30,13,4); g.fill(); g.strokeStyle=col.ink; g.lineWidth=2; g.stroke();
      g.fillStyle=col.mustard; g.beginPath(); g.arc(-6,-14,4,0,Math.PI*2); g.fill(); g.beginPath(); g.arc(5,-14,4,0,Math.PI*2); g.fill();
      g.fillStyle=col.ink; g.beginPath(); g.arc(-9,5,3.5,0,Math.PI*2); g.fill(); g.beginPath(); g.arc(9,5,3.5,0,Math.PI*2); g.fill();
      g.restore();
      g.fillStyle=col.ink; g.font='700 16px sans-serif'; g.textAlign='left';
      if(t<brake) g.fillText('BREMSE',10,22); else if(t<boost) g.fillText('TURBO',10,22);
    }
    function finishRace(){
      if(finished) return; finished=true; stop(); clearTimeout(hideTimer);
      if(active&&activeCard) activeCard.destroy();
      panel.replaceChildren(); draw();
      const T=t,timeP=clamp(60*(52-T)/26,0,60),corrP=correct*8;
      const res={points:Math.round(timeP+corrP),game:Math.round(timeP),quiz:corrP,gmax:60,qmax:40,glabel:'Banetid',qlabel:'Rigtige svar',
        text:'Mål efter '+T.toFixed(1).replace('.',',')+' s med '+correct+' af '+QS.length+' rigtige.',correct:correct,total:QS.length};
      endOverlay(box,'Mål! '+T.toFixed(1).replace('.',',')+' s',()=>resolve(res));
    }
    const stop=loop(dt=>{
      t+=dt; const sp=t<brake?10:t<boost?58:28; p+=sp*dt;
      if(!active&&qi<GU.length&&p/1000>=GU[qi]){ open(qi); qi++; }
      draw();
      L.textContent='Tid '+t.toFixed(1).replace('.',',')+' s'; Rr.textContent='Rigtige '+correct+' / '+QS.length;
      if(p>=1000) finishRace();
    });
    cleanup=()=>{ stop(); clearTimeout(hideTimer); if(activeCard) activeCard.destroy(); };
  });
}

/* ---------- flow ---------- */
function submit(r,res){
  const T=Net.T(),me=T.players[ME.pid]||{},upd={};
  if(!(me.rounds&&me.rounds['s'+r])) upd['players/'+ME.pid+'/rounds/s'+r]={p:res.points,g:res.game,q:res.quiz,gm:res.gmax,qm:res.qmax,gl:res.glabel,ql:res.qlabel,x:res.text};
  upd['players/'+ME.pid+'/done']=Math.max(me.done==null?-1:me.done,r);
  upd['players/'+ME.pid+'/live']=null;
  Net.patch(upd);
}
async function startPlay(r){
  if(playing) return; playing=true; renderLive();
  const R=ROUNDS[r]; let res;
  try{
    if(R.game==='coaster'){ res=await coasterRace(R,r); }
    else if(R.game==='quiz'){
      const q=await trivia(R,r,0),base=q.correct*7;
      res={points:q.points,game:base,quiz:q.bonus,gmax:70,qmax:30,glabel:'Rigtige svar (7 point hver)',qlabel:'Hurtighedsbonus',text:q.correct+' af '+q.total+' rigtige svar.'};
    }
    else {
      const g=await runMinigame(R),gp=Math.round(55*g.frac); sendLive(r,gp);
      const q=await trivia(R,r,gp);
      res={points:gp+q.points,game:gp,quiz:q.points,gmax:55,qmax:45,glabel:'Minispil',qlabel:'Spørgsmål',text:g.text+'. '+q.correct+' af '+q.total+' rigtige svar.'};
    }
  }catch(e){ if(window.console) console.error(e); res={points:0,game:0,quiz:0,gmax:55,qmax:45,glabel:'Minispil',qlabel:'Spørgsmål',text:'Noget gik galt på denne station.'}; }
  submit(r,res); playing=false; renderLive(); onChange();
}

function joinScreen(){
  const input=h('input',{id:'nameInput',type:'text',maxlength:'20',placeholder:'Dit navn',autocomplete:'off',value:ME.name||''});
  const go=h('button',{class:'btn',type:'button',text:'Hop ombord'});
  go.addEventListener('click',()=>{
    const n=input.value.trim(); if(!n){ input.classList.add('bad'); input.focus(); return; }
    ME.name=n; save('hb-me',ME); registerMe(); onChange();
  });
  input.addEventListener('keydown',e=>{ if(e.key==='Enter') go.click(); });
  show('join',
    h('p',{class:'label',text:'Bustur · Haaning A/S'}),
    h('h1',{class:'sign',text:'Haaning Bustur'}),
    h('p',{class:'lead',text:'Seks stationer fra Haanings egne projekter og en popquiz til sidst. Hele bussen spiller samtidigt, og stillingen opdateres live.'}),
    h('div',{class:'field'},h('label',{for:'nameInput',text:'Navn'}),input),
    h('div',{class:'row'},go),
    h('p',{class:'foot',text:'Du skal ikke logge ind. Skriv dit navn, og vent på, at værten starter første station.'}));
}
function connectingScreen(msg){ show('connect',h('p',{class:'label',text:'Haaning Bustur'}),h('h2',{class:'sign sm',text:msg||'Forbinder'}),h('p',{class:'muted',text:'Et øjeblik.'})); }

function lobbyScreen(){
  show('lobby',h('p',{class:'label',text:'Ombord'}),h('h2',{class:'sign sm',text:'Venter på afgang'}),
    h('p',{class:'lead',text:'Værten starter første station, når alle er med.'}),
    h('div',{id:'lobbyList',class:'chips'}),
    h('p',{class:'foot',text:'Alle spiller samme station samtidigt. Mellem stationerne kan du se stillingen, og næste station starter, når alle er klar.'}));
  refreshLobby();
}
function refreshLobby(){
  const L=$('#lobbyList'); if(!L) return; const rs=rows(Net.T());
  L.replaceChildren.apply(L,rs.map(x=>h('span',{class:'chip'+(x.me?' me':'')+(x.on?'':' off'),text:x.name})));
}

function introScreen(r){
  introRound=r; const R=ROUNDS[r],cd=h('p',{class:'bigcd'}); let iv=0;
  show('intro',h('p',{class:'label',text:R.finale?'Finale':'Station '+(r+1)+' af '+ROUNDS.length}),h('h2',{class:'sign sm',text:R.title}),h('p',{class:'place',text:R.place}),h('p',{text:R.fact}),
    h('div',{class:'panel'},h('p',{class:'label',text:R.gameName}),h('p',{text:R.howto})),
    cd,h('p',{class:'foot',text:'Alle starter samtidigt. Hold telefonen klar.'}));
  const tick=()=>{ const ms=Net.T().state.startAt-Net.now(),s=Math.ceil(ms/1000); cd.textContent=s>0?String(s):'Kør!'; if(ms<=0){ clearInterval(iv); onChange(); } };
  iv=setInterval(tick,150); cleanup=()=>clearInterval(iv); tick();
}

function resultsScreen(r){
  resultsRound=r; const R=ROUNDS[r],T=Net.T(),me=(T.players[ME.pid]||{}).rounds||{},res=me['s'+r]||{p:0,g:0,q:0,gl:'Minispil',ql:'Spørgsmål',gm:55,qm:45,x:''};
  const last=r>=ROUNDS.length-1;
  const rdy=h('button',{id:'rdyBtn',class:'btn',type:'button',text:last?'Klar til slutresultatet':'Klar til næste station'});
  rdy.addEventListener('click',()=>{ Net.patch({['players/'+ME.pid+'/ready']:r}); refreshResults(); });
  show('results',h('p',{class:'label',text:R.finale?'Finalen er færdig':'Station '+(r+1)+' færdig'}),h('h2',{class:'sign sm',text:R.title}),
    h('p',{class:'bigpts'},String(res.p),h('small',{text:'/ 100 point'})),
    h('table',{class:'tbl'},h('thead',null,h('tr',null,h('th',{text:'Del'}),h('th',{text:'Point'}))),
      h('tbody',null,
        h('tr',null,h('td',{text:(res.gl||'Minispil')+' (maks. '+(res.gm||55)+')'}),h('td',{text:String(res.g||0)})),
        h('tr',null,h('td',{text:(res.ql||'Spørgsmål')+' (maks. '+(res.qm||45)+')'}),h('td',{text:String(res.q||0)})))),
    h('p',{class:'muted',text:res.x||''}),
    h('p',{class:'label',text:'Stillingen'}),h('div',{id:'resBoard'}),
    h('p',{id:'resWait',class:'muted'}),
    h('div',{class:'row'},rdy));
  refreshResults();
}
function refreshResults(){
  const B=$('#resBoard'); if(!B) return; const T=Net.T(),r=resultsRound,rs=rows(T),on=rs.filter(x=>x.on);
  B.replaceChildren(boardEl(rs,0));
  const notDone=on.filter(x=>x.done<r),notReady=on.filter(x=>x.ready<r),me=rs.find(x=>x.me),btn=$('#rdyBtn'),w=$('#resWait');
  const rdy=me&&me.ready>=r; if(btn){ btn.disabled=!!rdy; btn.textContent=rdy?'Du er klar':(r>=ROUNDS.length-1?'Klar til slutresultatet':'Klar til næste station'); }
  if(notDone.length) w.textContent='Venter på at '+notDone.map(x=>x.name).join(', ')+' bliver færdig'+(notDone.length>1?'e':'')+'.';
  else if(notReady.length) w.textContent='Alle er færdige. Klar: '+(on.length-notReady.length)+' af '+on.length+'.';
  else w.textContent='Alle er klar.';
}

function finalScreen(){
  const T=Net.T(),rs=rows(T),w=rs[0],mi=rs.findIndex(x=>x.me);
  show('final',h('p',{class:'label',text:'Slutresultat'}),h('h2',{class:'sign sm',text:'Hele ruten er kørt'}),
    w?h('div',{class:'winner'},h('small',{text:'Vinder'}),h('b',{text:w.name}),h('span',{text:fmt(w.tot)+' point'})):null,
    mi>=0?h('p',{class:'lead',text:'Din placering: nr. '+(mi+1)+' af '+rs.length+' med '+fmt(rs[mi].tot)+' point.'}):null,
    h('div',{id:'finBoard'}),
    h('p',{class:'muted',text:'Vinderen henter præmien hos værten.'}));
  refreshFinal();
}
function refreshFinal(){ const B=$('#finBoard'); if(B) B.replaceChildren(boardEl(rows(Net.T()),0)); }

/* ---------- vært ---------- */
let hostUI=null;
function hostAdvance(){
  const st=Net.T().state,next=(st.phase==='lobby'?-1:st.round)+1;
  if(next>=ROUNDS.length) Net.patch({state:{phase:'final',round:st.round}});
  else Net.patch({state:{phase:'round',round:next,startAt:Net.now()+INTRO_MS}});
}
function buildHost(){
  if(!HOST) return; const box=$('#host'); box.hidden=false;
  const info=h('p',{class:'muted'});
  const start=h('button',{class:'btn',type:'button',text:'Start station 1'}); start.addEventListener('click',hostAdvance);
  const next=h('button',{class:'btn dark',type:'button',text:'Videre nu'}); next.addEventListener('click',hostAdvance);
  const reset=h('button',{class:'btn ghost',type:'button',text:'Nulstil spillet'});
  twoStep(reset,'Tryk igen for at nulstille alt',()=>{ Net.patch({state:{phase:'lobby',round:-1},players:null}); });
  box.replaceChildren(h('div',{class:'hostbox'},h('p',{class:'label',text:'Vært'}),info,h('div',{class:'row'},start,next,reset),
    h('p',{class:'foot',text:'Næste station starter af sig selv, når alle er færdige og klar. «Videre nu» springer dem over, der hænger. Hold denne side åben under turen.'})));
  hostUI={info:info,start:start,next:next};
  setInterval(hostTick,1000);
}
function hostTick(){
  const T=Net.T(),st=T.state; if(st.phase!=='round'||Net.now()<st.startAt) return;
  const on=rows(T).filter(x=>x.on);
  if(on.length&&on.every(x=>x.done>=st.round&&x.ready>=st.round)) hostAdvance();
}
function renderHost(){
  if(!hostUI) return; const T=Net.T(),st=T.state,rs=rows(T),on=rs.filter(x=>x.on);
  if(st.phase==='lobby'){ hostUI.info.textContent=on.length+' spillere ombord.'; hostUI.start.hidden=false; hostUI.next.hidden=true; }
  else if(st.phase==='round'){
    const d=on.filter(x=>x.done>=st.round).length,k=on.filter(x=>x.ready>=st.round).length;
    hostUI.info.textContent='Station '+(st.round+1)+' af '+ROUNDS.length+' · færdige '+d+'/'+on.length+' · klar '+k+'/'+on.length+'.';
    hostUI.start.hidden=true; hostUI.next.hidden=false; hostUI.next.textContent=st.round>=ROUNDS.length-1?'Vis slutresultat nu':'Videre nu';
  } else { hostUI.info.textContent='Spillet er slut.'; hostUI.start.hidden=true; hostUI.next.hidden=true; }
}

/* ---------- styring af skærme ---------- */
function onChange(){
  if(!booted) return;
  updateBar(); renderHost(); if(playing) renderLive();
  if(!Net.loaded()){ if(screen!=='connect') connectingScreen(); return; }
  if(!ME.name){ if(screen!=='join') joinScreen(); return; }
  const T=Net.T(),st=T.state;
  if(!T.players[ME.pid]) registerMe();
  if(playing) return;
  if(st.phase==='lobby'){ if(screen!=='lobby') lobbyScreen(); else refreshLobby(); }
  else if(st.phase==='round'){
    const r=st.round,me=T.players[ME.pid]||{};
    if(me.done!=null&&me.done>=r){ if(screen!=='results'||resultsRound!==r) resultsScreen(r); else refreshResults(); }
    else if(Net.now()<st.startAt){ if(screen!=='intro'||introRound!==r) introScreen(r); }
    else startPlay(r);
  }
  else if(st.phase==='final'){ if(screen!=='final') finalScreen(); else refreshFinal(); }
}

Net.on(onChange);
booted=true;
if(!LIVE){ $('#demoBar').hidden=false; startBots(); }
buildHost();
setInterval(()=>{ if(ME.name&&Net.loaded()) Net.patch({['players/'+ME.pid+'/seen']:Net.now()}); },8000);
Net.start();
if(!ME.name&&(Net.loaded())) joinScreen(); else connectingScreen();
setTimeout(()=>{ if(!Net.loaded()&&screen==='connect') connectingScreen('Ingen forbindelse til spillet'); },9000);
onChange();
})();
